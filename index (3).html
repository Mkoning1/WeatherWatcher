<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WeatherWatcher</title>
<meta name="description" content="Actueel weer, neerslag komende twee uur en verwachting voor 7 dagen.">
<meta name="theme-color" content="#E6ECF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15212B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WeatherWatcher">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315212B'/%3E%3Cpath d='M16 6c4 5.5 6.5 9 6.5 12.5a6.5 6.5 0 0 1-13 0C9.5 15 12 11.5 16 6z' fill='%236EA8E4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E6ECF0;
  --surface: #F2F5F7;
  --ink: #16232D;
  --ink-2: #4E5E69;
  --ink-3: #82919B;
  --rule: #C8D2D8;
  --rain: #1F64A8;
  --sun: #B9820C;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15212B;
    --surface: #1C2A35;
    --ink: #E4EAEE;
    --ink-2: #A5B3BC;
    --ink-3: #6D7E89;
    --rule: #2C3B47;
    --rain: #6EA8E4;
    --sun: #E1B043;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15212B; --surface: #1C2A35; --ink: #E4EAEE; --ink-2: #A5B3BC; --ink-3: #6D7E89;
  --rule: #2C3B47; --rain: #6EA8E4; --sun: #E1B043; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Schibsted Grotesk", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.wrap { max-width: 46rem; margin: 0 auto; padding: 0 1.25rem 2.5rem; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--rain); outline-offset: 2px; }
button { font: inherit; color: inherit; }

/* Kop */
.top { display: flex; align-items: center; gap: .5rem; padding: 1rem 0 .25rem; }
.loc { flex: 1; min-width: 0; }
.loc h1 { margin: 0; font-size: 1.125rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.loc p { margin: 0; font-size: .875rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center;
  border: 1px solid var(--rule); border-radius: 50%; background: transparent; cursor: pointer;
}
.iconbtn:hover { background: var(--surface); }
.iconbtn[aria-expanded="true"] { background: var(--surface); border-color: var(--ink-3); }
.iconbtn svg { width: 20px; height: 20px; }
.busy #btn-refresh svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Zoeken */
.search { padding: .5rem 0 .25rem; }
.search input {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  padding: .75rem 1rem; border: 1px solid var(--rule); border-radius: 10px;
}
.search input::placeholder { color: var(--ink-3); }
.results { list-style: none; margin: .5rem 0 0; padding: 0; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); overflow: hidden; }
.results button { display: block; width: 100%; text-align: left; padding: .7rem 1rem; background: none; border: 0; border-top: 1px solid var(--rule); cursor: pointer; }
.results li:first-child button { border-top: 0; }
.results button:hover { background: var(--bg); }
.results span { display: block; font-size: .8125rem; color: var(--ink-2); }
.msg { margin: .5rem 0 0; font-size: .875rem; color: var(--ink-2); }

/* Hoofdregel */
.hero { display: grid; grid-template-columns: 1fr auto; align-items: start; column-gap: 1rem; padding: 1.75rem 0 .5rem; }
.now { margin: 0; font-size: clamp(2.5rem, 10.5vw, 4.5rem); line-height: 1.03; font-weight: 500; letter-spacing: -.028em; text-wrap: balance; }
.hero-icon { color: var(--ink); padding-top: .35rem; }
.hero-icon svg { width: clamp(56px, 15vw, 84px); height: auto; display: block; }
.rainline { grid-column: 1 / -1; margin: .9rem 0 0; font-size: clamp(1.15rem, 4.3vw, 1.4rem); line-height: 1.3; color: var(--ink-2); font-weight: 500; }
.rainline.wet { color: var(--rain); }

/* Neerslaggrafiek */
h2 { margin: 0 0 .75rem; font-size: 1.0625rem; font-weight: 600; }
.nowcast { padding: 1.25rem 0 1.75rem; }
.nowcast h2 { font-size: .9375rem; color: var(--ink-2); font-weight: 500; }
.chart { display: grid; grid-template-columns: 1fr 3rem; column-gap: .5rem; }
.plot { position: relative; height: 104px; border-bottom: 1px solid var(--ink-3); }
.guide { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--rule); }
.bars { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; align-items: end; }
.bar { background: var(--rain); border-radius: 3px 3px 0 0; }
.bar.dry { background: var(--rule); border-radius: 1px; }
.scale { position: relative; height: 104px; font-size: .75rem; color: var(--ink-3); }
.scale span { position: absolute; left: 0; transform: translateY(-50%); }
.ticks { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-top: .35rem; font-size: .8125rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ticks span:nth-child(even) { visibility: hidden; }
.note { margin: .75rem 0 0; font-size: .8125rem; color: var(--ink-3); }

/* Details */
.details { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.25rem, 1fr)); gap: 1.1rem 1.5rem; margin: 0 0 2.25rem; padding: 1.25rem 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.details dt { font-size: .8125rem; color: var(--ink-2); }
.details dd { margin: .15rem 0 0; font-size: 1.125rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.details dd span { display: block; font-size: .8125rem; font-weight: 400; color: var(--ink-2); }

/* Per uur */
.hours-sec { margin-bottom: 2.25rem; }
.hours { display: flex; overflow-x: auto; margin: 0 -1.25rem; padding: 0 1.25rem .5rem; scroll-snap-type: x proximity; scrollbar-width: thin; }
.hour { flex: 0 0 4.25rem; display: flex; flex-direction: column; align-items: center; gap: .3rem; padding: .25rem 0 .4rem; border-left: 1px solid var(--rule); scroll-snap-align: start; }
.hour:first-child { border-left-color: transparent; }
.hour.newday { border-left-color: var(--ink-3); }
.hour .d { height: 1rem; font-size: .75rem; font-weight: 600; color: var(--ink-2); }
.hour time { font-size: .8125rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hour:first-child time { color: var(--ink); font-weight: 600; }
.hour svg { width: 30px; height: 30px; }
.hour .t { font-size: 1.0625rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.hour .p { font-size: .75rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.hour .p.wet { color: var(--rain); font-weight: 500; }

/* 7 dagen */
.days { list-style: none; margin: 0 0 2rem; padding: 0; }
.day { display: grid; grid-template-columns: 4.75rem 1.9rem 3rem 2.25rem 1fr 2.25rem; align-items: center; column-gap: .55rem; padding: .7rem 0; border-top: 1px solid var(--rule); }
.day:last-child { border-bottom: 1px solid var(--rule); }
.day .name { font-weight: 600; line-height: 1.2; }
.day .name span { display: block; font-size: .75rem; font-weight: 400; color: var(--ink-2); margin-top: .15rem; }
.day svg { width: 28px; height: 28px; display: block; }
.day .pp { font-size: .8125rem; line-height: 1.25; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.day .pp.wet { color: var(--rain); }
.day .pp span { display: block; font-size: .75rem; }
.day .lo, .day .hi { font-variant-numeric: tabular-nums; }
.day .lo { color: var(--ink-2); text-align: right; }
.day .hi { font-weight: 600; }
.range { position: relative; height: 6px; border-radius: 3px; background: var(--rule); }
.range i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--ink-2); }

/* Status en voet */
.status { padding: 3rem 0; color: var(--ink-2); }
.status p { margin: 0 0 1rem; }
.btn { padding: .65rem 1.1rem; border: 1px solid var(--ink-3); border-radius: 999px; background: var(--surface); cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.notice { margin: .5rem 0 0; padding: .65rem .9rem; border-left: 3px solid var(--rain); background: var(--surface); font-size: .875rem; }
.foot { border-top: 1px solid var(--rule); padding-top: 1rem; font-size: .8125rem; color: var(--ink-2); }
.foot p { margin: 0 0 .35rem; }
.foot a { color: inherit; }

/* Pictogrammen */
.ic .cl { fill: var(--bg); }
.ic .sun { stroke: var(--sun); }
.ic .moon { stroke: var(--ink-2); }
.ic .rn { stroke: var(--rain); }
.ic .sn { fill: var(--ink-2); stroke: none; }
.ic .bolt { stroke: var(--sun); }
.ic .fg { stroke: var(--ink-2); }

@media (min-width: 40rem) {
  .wrap { padding-left: 2rem; padding-right: 2rem; }
  .hours { margin: 0 -2rem; padding: 0 2rem .5rem; }
  .day { grid-template-columns: 6.5rem 2.25rem 4rem 2.5rem 1fr 2.5rem; column-gap: .9rem; }
}
@media (prefers-reduced-motion: reduce) {
  .busy #btn-refresh svg { animation: none; }
  .hours { scroll-behavior: auto; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="loc">
      <h1 id="loc-name">WeatherWatcher</h1>
      <p id="loc-region">&nbsp;</p>
    </div>
    <button class="iconbtn" id="btn-search" type="button" aria-label="Plaats zoeken" aria-expanded="false" aria-controls="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
    </button>
    <button class="iconbtn" id="btn-gps" type="button" aria-label="Mijn locatie gebruiken">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
    </button>
    <button class="iconbtn" id="btn-refresh" type="button" aria-label="Vernieuwen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4v4h-4"/></svg>
    </button>
  </header>

  <div class="search" id="search" hidden>
    <label class="vh" for="q">Plaats zoeken</label>
    <input id="q" type="search" placeholder="Zoek een plaats" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="search">
    <ul class="results" id="results" hidden></ul>
    <p class="msg" id="search-msg" hidden></p>
  </div>
  <p class="notice" id="notice" role="status" hidden></p>

  <main>
    <div class="status" id="status"><p id="status-text">Weer ophalen…</p></div>

    <div id="content" hidden>
      <section class="hero" aria-live="polite">
        <p class="now" id="now"></p>
        <div class="hero-icon" id="now-icon"></div>
        <p class="rainline" id="rainline"></p>
      </section>

      <section class="nowcast" aria-labelledby="h-rain">
        <h2 id="h-rain">Neerslag komende 2 uur</h2>
        <div class="chart">
          <div class="plot">
            <div class="guide" style="top:0"></div>
            <div class="guide" style="top:50%"></div>
            <div class="bars" id="bars"></div>
          </div>
          <div class="scale" aria-hidden="true">
            <span style="top:0">zwaar</span>
            <span style="top:50%">matig</span>
            <span style="top:82%">licht</span>
          </div>
          <div class="ticks" id="ticks"></div>
        </div>
        <p class="note">Modelverwachting per kwartier.</p>
      </section>

      <dl class="details" id="details"></dl>

      <section class="hours-sec" aria-labelledby="h-hours">
        <h2 id="h-hours">Komende 24 uur</h2>
        <div class="hours" id="hours" tabindex="0" aria-label="Verwachting per uur, horizontaal scrollen"></div>
      </section>

      <section aria-labelledby="h-days">
        <h2 id="h-days">Komende 7 dagen</h2>
        <ol class="days" id="days"></ol>
      </section>
    </div>
  </main>

  <footer class="foot">
    <p id="updated"></p>
    <p>Weerdata van <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>, licentie CC&nbsp;BY&nbsp;4.0.</p>
  </footer>
</div>

<script>
(() => {
  'use strict';

  const API = 'https://api.open-meteo.com/v1/forecast';
  const GEO = 'https://geocoding-api.open-meteo.com/v1/search';
  const STORE_KEY = 'weatherwatcher:locatie';
  const DEFAULT_LOC = { name: 'De Bilt', region: 'Utrecht, Nederland', lat: 52.11, lon: 5.18 };
  const REFRESH_MS = 15 * 60 * 1000;
  const STALE_MS = 10 * 60 * 1000;
  const WET = 0.1; // mm per uur

  const $ = (id) => document.getElementById(id);
  const state = { loc: null, data: null, fetchedAt: 0, loading: false };

  /* ---------- Opslag ---------- */
  function readLoc() {
    try { const v = localStorage.getItem(STORE_KEY); return v ? JSON.parse(v) : null; } catch { return null; }
  }
  function writeLoc(loc) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(loc)); } catch { /* opslag niet beschikbaar */ }
  }

  /* ---------- Opmaak ---------- */
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (n, d = 0) => Number(n).toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d });
  const deg = (t) => `${Math.round(t) === 0 ? 0 : Math.round(t)}°`.replace('-', '−');
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  let F = null;
  function makeFormatters(tz) {
    return {
      time: new Intl.DateTimeFormat('nl-NL', { timeZone: tz, hour: '2-digit', minute: '2-digit' }),
      wd: new Intl.DateTimeFormat('nl-NL', { timeZone: tz, weekday: 'short' }),
      day: new Intl.DateTimeFormat('nl-NL', { timeZone: tz, day: 'numeric' }),
      hour: new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: 'numeric', hourCycle: 'h23' }),
    };
  }
  const at = (unix) => new Date(unix * 1000);
  const hhmm = (unix) => F.time.format(at(unix));
  const weekday = (unix) => F.wd.format(at(unix)).replace('.', '');

  const DIRS = ['N', 'NO', 'O', 'ZO', 'Z', 'ZW', 'W', 'NW'];
  const dir = (d) => DIRS[Math.round(((d % 360) + 360) % 360 / 45) % 8];
  const BFT = [1, 6, 12, 20, 29, 39, 50, 62, 75, 89, 103, 118];
  const bft = (kmh) => BFT.filter((t) => kmh >= t).length;

  /* ---------- Weercodes (WMO) ---------- */
  const WMO = {
    0: { d: 'zonnig', n: 'helder', i: 'clear' },
    1: { d: 'overwegend zonnig', n: 'overwegend helder', i: 'partly' },
    2: { d: 'half bewolkt', i: 'partly' },
    3: { d: 'bewolkt', i: 'cloudy' },
    45: { d: 'mist', i: 'fog' },
    48: { d: 'rijpmist', i: 'fog' },
    51: { d: 'lichte motregen', i: 'drizzle' },
    53: { d: 'motregen', i: 'drizzle' },
    55: { d: 'dichte motregen', i: 'drizzle' },
    56: { d: 'lichte ijzel', i: 'sleet' },
    57: { d: 'ijzel', i: 'sleet' },
    61: { d: 'lichte regen', i: 'rain' },
    63: { d: 'regen', i: 'rain' },
    65: { d: 'zware regen', i: 'rain' },
    66: { d: 'lichte ijzelregen', i: 'sleet' },
    67: { d: 'ijzelregen', i: 'sleet' },
    71: { d: 'lichte sneeuw', i: 'snow' },
    73: { d: 'sneeuw', i: 'snow' },
    75: { d: 'zware sneeuw', i: 'snow' },
    77: { d: 'motsneeuw', i: 'snow' },
    80: { d: 'lichte buien', i: 'showers' },
    81: { d: 'buien', i: 'showers' },
    82: { d: 'zware buien', i: 'showers' },
    85: { d: 'lichte sneeuwbuien', i: 'snow' },
    86: { d: 'zware sneeuwbuien', i: 'snow' },
    95: { d: 'onweer', i: 'thunder' },
    96: { d: 'onweer met hagel', i: 'thunder' },
    99: { d: 'zwaar onweer met hagel', i: 'thunder' },
  };
  function describe(code, isDay) {
    const w = WMO[code] || { d: 'onbekend', i: 'cloudy' };
    return { text: isDay ? w.d : (w.n || w.d), kind: w.i };
  }

  /* ---------- Pictogrammen ---------- */
  const CLOUD = 'M9.5 25h14a5 5 0 0 0 .9-9.92 7 7 0 0 0-13.5 1.7A4.1 4.1 0 0 0 9.5 25z';
  function rays(cx, cy, r1, r2) {
    let s = '';
    for (let k = 0; k < 8; k++) {
      const a = (k * Math.PI) / 4;
      s += `<line x1="${(cx + r1 * Math.cos(a)).toFixed(2)}" y1="${(cy + r1 * Math.sin(a)).toFixed(2)}" x2="${(cx + r2 * Math.cos(a)).toFixed(2)}" y2="${(cy + r2 * Math.sin(a)).toFixed(2)}"/>`;
    }
    return s;
  }
  const SUN = `<g class="sun"><circle cx="16" cy="16" r="5.5"/>${rays(16, 16, 8.5, 11.5)}</g>`;
  const SUN_S = (x, y) => `<g class="sun"><circle cx="${x}" cy="${y}" r="3.8"/>${rays(x, y, 6.2, 8.2)}</g>`;
  const MOON = '<path class="moon" d="M21 18.5A7.5 7.5 0 1 1 13.5 9a6 6 0 0 0 7.5 9.5z"/>';
  const MOON_S = (x, y) => `<g transform="translate(${x - 11} ${y - 11})"><path class="moon" d="M15 13.2A5.2 5.2 0 1 1 9.8 6.6a4.2 4.2 0 0 0 5.2 6.6z"/></g>`;
  const cloud = (tx, ty) => `<path class="cl" transform="translate(${tx} ${ty})" d="${CLOUD}"/>`;
  const RAIN = '<path class="rn" d="M12.5 23l-1.6 4.2M17.5 23l-1.6 4.2M22.5 23l-1.6 4.2"/>';
  const DRIZZLE = '<path class="rn" d="M12.3 23.5l-.6 1.4M17.3 25.5l-.6 1.4M22.3 23.5l-.6 1.4M14.8 28l-.6 1.4"/>';
  const SNOW = '<g class="sn"><circle cx="12" cy="24" r="1.2"/><circle cx="17" cy="26.5" r="1.2"/><circle cx="22" cy="24" r="1.2"/><circle cx="14.5" cy="29" r="1.2"/><circle cx="19.5" cy="29" r="1.2"/></g>';
  const SLEET = '<path class="rn" d="M13 23l-1.6 4.2M21 23l-1.6 4.2"/><g class="sn"><circle cx="17" cy="25.5" r="1.2"/><circle cx="15" cy="29.5" r="1.2"/></g>';
  const BOLT = '<path class="bolt" d="M17.5 21.5l-3.2 4.6h4l-2.8 4.4"/>';
  const FOG = '<path class="fg" d="M6 11h20M8 16h17M6 21h20M10 26h13"/>';

  function icon(kind, isDay) {
    const small = isDay ? SUN_S(10, 9) : MOON_S(10, 9);
    let inner;
    switch (kind) {
      case 'clear': inner = isDay ? SUN : MOON; break;
      case 'partly': inner = (isDay ? SUN_S(11, 11) : MOON_S(11, 11)) + cloud(2, 2); break;
      case 'cloudy': inner = `<path class="cl" transform="translate(-3 -5) scale(.8)" d="${CLOUD}"/>` + cloud(2, 1); break;
      case 'fog': inner = FOG; break;
      case 'drizzle': inner = cloud(0, -5) + DRIZZLE; break;
      case 'rain': inner = cloud(0, -5) + RAIN; break;
      case 'showers': inner = small + cloud(2, -4) + RAIN; break;
      case 'snow': inner = cloud(0, -5) + SNOW; break;
      case 'sleet': inner = cloud(0, -5) + SLEET; break;
      case 'thunder': inner = cloud(0, -5) + BOLT; break;
      default: inner = cloud(0, 0);
    }
    return `<svg class="ic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  }

  /* ---------- Data ophalen ---------- */
  function forecastUrl(loc) {
    const p = new URLSearchParams({
      latitude: loc.lat.toFixed(4),
      longitude: loc.lon.toFixed(4),
      current: 'temperature_2m,apparent_temperature,relative_humidity_2m,is_day,precipitation,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
      minutely_15: 'precipitation',
      hourly: 'temperature_2m,precipitation_probability,precipitation,weather_code,is_day',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant,sunrise,sunset',
      timezone: 'auto',
      timeformat: 'unixtime',
      forecast_days: '7',
    });
    return `${API}?${p}`;
  }

  async function refresh() {
    if (state.loading || !state.loc) return;
    state.loading = true;
    document.body.classList.add('busy');
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(forecastUrl(state.loc), { signal: ctrl.signal });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || data.error) throw new Error((data && data.reason) || `HTTP ${res.status}`);
      state.data = data;
      state.fetchedAt = Date.now();
      F = makeFormatters(data.timezone || 'Europe/Amsterdam');
      render();
      hideNotice();
    } catch (err) {
      console.error(err);
      if (state.data) {
        showNotice(`Vernieuwen mislukt. Je ziet de gegevens van ${hhmm(state.fetchedAt / 1000)}.`);
      } else {
        showError('Weerdata ophalen mislukt. Controleer je internetverbinding en probeer het opnieuw.');
      }
    } finally {
      clearTimeout(timer);
      state.loading = false;
      document.body.classList.remove('busy');
    }
  }

  /* ---------- Weergave ---------- */
  function render() {
    const d = state.data;
    const c = d.current;
    const now = describe(c.weather_code, c.is_day === 1);

    $('status').hidden = true;
    $('content').hidden = false;

    $('now').textContent = `${deg(c.temperature_2m)} en ${now.text}`;
    $('now-icon').innerHTML = icon(now.kind, c.is_day === 1);

    // Neerslag komende 2 uur
    const slots = nowcast(d);
    const line = rainSentence(slots, c.temperature_2m);
    const rl = $('rainline');
    rl.textContent = line.text;
    rl.classList.toggle('wet', line.wet);

    $('bars').innerHTML = slots.map((s) => {
      const wet = s.mmh >= WET;
      const h = wet ? Math.max(6, Math.min(100, Math.sqrt(s.mmh / 10) * 100)) : 0;
      const label = `${hhmm(s.start)}–${hhmm(s.end)}: ${wet ? num(s.mmh, 1) + ' mm per uur' : 'droog'}`;
      return wet
        ? `<div class="bar" style="height:${h.toFixed(1)}%" title="${label}" role="img" aria-label="${label}"></div>`
        : `<div class="bar dry" style="height:2px" title="${label}" role="img" aria-label="${label}"></div>`;
    }).join('');
    $('ticks').innerHTML = slots.map((s) => `<span>${hhmm(s.start)}</span>`).join('');

    // Details
    const day0 = d.daily;
    $('details').innerHTML = [
      ['Gevoelstemperatuur', deg(c.apparent_temperature)],
      ['Wind', `${bft(c.wind_speed_10m)} Bft ${dir(c.wind_direction_10m)}`, `${num(c.wind_speed_10m)} km/u`],
      ['Windstoten', `${num(c.wind_gusts_10m)} km/u`],
      ['Luchtvochtigheid', `${num(c.relative_humidity_2m)}%`],
      ['Luchtdruk', `${Math.round(c.pressure_msl)} hPa`],
      ['Zon op en onder', `${hhmm(day0.sunrise[0])}–${hhmm(day0.sunset[0])}`],
    ].map(([k, v, sub]) => `<div><dt>${k}</dt><dd>${v}${sub ? `<span>${sub}</span>` : ''}</dd></div>`).join('');

    renderHours(d);
    renderDays(d);

    $('updated').textContent = `Bijgewerkt om ${hhmm(state.fetchedAt / 1000)}.`;
  }

  function nowcast(d) {
    const m = d.minutely_15;
    if (!m || !m.time) return [];
    const now = Date.now() / 1000;
    const out = [];
    for (let i = 0; i < m.time.length && out.length < 8; i++) {
      // Elke waarde is de som van het voorafgaande kwartier.
      if (m.time[i] > now) out.push({ start: m.time[i] - 900, end: m.time[i], mmh: (m.precipitation[i] ?? 0) * 4 });
    }
    return out;
  }

  function rainSentence(slots, t) {
    if (!slots.length) return { text: 'Geen neerslagverwachting beschikbaar voor deze locatie.', wet: false };
    const word = t <= 1 ? 'neerslag' : 'regen';
    const strength = (mmh) => (mmh < 2.5 ? 'lichte' : mmh < 10 ? 'matige' : 'zware');
    const first = slots.findIndex((s) => s.mmh >= WET);
    if (first === -1) return { text: 'Droog de komende twee uur.', wet: false };
    if (first === 0) {
      const dryAt = slots.findIndex((s) => s.mmh < WET);
      const peak = Math.max(...slots.slice(0, dryAt === -1 ? undefined : dryAt).map((s) => s.mmh));
      if (dryAt === -1) return { text: `${cap(strength(peak))} ${word} de komende twee uur.`, wet: true };
      return { text: `Nu ${strength(peak)} ${word}, droog vanaf ${hhmm(slots[dryAt].start)}.`, wet: true };
    }
    const rest = slots.slice(first);
    const stop = rest.findIndex((s) => s.mmh < WET);
    const peak = Math.max(...rest.slice(0, stop === -1 ? undefined : stop).map((s) => s.mmh));
    return { text: `Droog tot ${hhmm(slots[first].start)}, daarna ${strength(peak)} ${word}.`, wet: true };
  }

  function renderHours(d) {
    const h = d.hourly;
    const now = Date.now() / 1000;
    let i = h.time.findIndex((t) => t + 3600 > now);
    if (i < 0) i = 0;
    const cells = [];
    for (let k = i; k < Math.min(i + 24, h.time.length); k++) {
      const t = h.time[k];
      const isDay = h.is_day[k] === 1;
      const w = describe(h.weather_code[k], isDay);
      const prob = h.precipitation_probability ? h.precipitation_probability[k] : null;
      const mm = h.precipitation[k] ?? 0;
      const wet = (prob ?? 0) >= 30 || mm >= 0.1;
      const midnight = parseInt(F.hour.format(at(t)), 10) === 0 && k !== i;
      const pText = prob != null ? `${num(prob)}%` : (mm >= 0.1 ? `${num(mm, 1)} mm` : '–');
      cells.push(
        `<div class="hour${midnight ? ' newday' : ''}" role="group" aria-label="${k === i ? 'Nu' : hhmm(t)}: ${deg(h.temperature_2m[k])}, ${w.text}, neerslagkans ${pText}">` +
        `<span class="d">${midnight ? weekday(t) : ''}</span>` +
        `<time>${k === i ? 'Nu' : hhmm(t)}</time>${icon(w.kind, isDay)}` +
        `<span class="t">${deg(h.temperature_2m[k])}</span>` +
        `<span class="p${wet ? ' wet' : ''}">${pText}</span></div>`
      );
    }
    $('hours').innerHTML = cells.join('');
  }

  function renderDays(d) {
    const x = d.daily;
    const lo = Math.min(...x.temperature_2m_min);
    const hi = Math.max(...x.temperature_2m_max);
    const span = Math.max(1, hi - lo);
    $('days').innerHTML = x.time.map((t, i) => {
      const w = describe(x.weather_code[i], true);
      const name = i === 0 ? 'Vandaag' : i === 1 ? 'Morgen' : `${cap(weekday(t))} ${F.day.format(at(t))}`;
      const prob = x.precipitation_probability_max ? x.precipitation_probability_max[i] : null;
      const sum = x.precipitation_sum[i] ?? 0;
      const wet = sum >= 0.1;
      const left = ((x.temperature_2m_min[i] - lo) / span) * 100;
      const width = Math.max(2, ((x.temperature_2m_max[i] - x.temperature_2m_min[i]) / span) * 100);
      return `<li class="day" aria-label="${name}: ${w.text}, ${deg(x.temperature_2m_min[i])} tot ${deg(x.temperature_2m_max[i])}${wet ? `, ${num(sum, 1)} mm neerslag` : ''}">` +
        `<span class="name">${name}<span>${bft(x.wind_speed_10m_max[i])} Bft ${dir(x.wind_direction_10m_dominant[i])}</span></span>` +
        icon(w.kind, true) +
        `<span class="pp${wet ? ' wet' : ''}">${prob != null ? num(prob) + '%' : '–'}${wet ? `<span>${num(sum, 1)} mm</span>` : ''}</span>` +
        `<span class="lo">${deg(x.temperature_2m_min[i])}</span>` +
        `<span class="range"><i style="left:${left.toFixed(1)}%;width:${width.toFixed(1)}%"></i></span>` +
        `<span class="hi">${deg(x.temperature_2m_max[i])}</span></li>`;
    }).join('');
  }

  /* ---------- Status ---------- */
  function showError(text) {
    $('content').hidden = true;
    $('status').hidden = false;
    $('status').innerHTML = `<p>${esc(text)}</p><button class="btn" type="button" id="retry">Opnieuw proberen</button>`;
    $('retry').addEventListener('click', refresh);
  }
  function setStatus(text) {
    if (state.data) return;
    $('status').hidden = false;
    $('status').innerHTML = `<p>${esc(text)}</p>`;
  }
  let noticeTimer;
  function showNotice(text, ms) {
    const n = $('notice');
    n.textContent = text;
    n.hidden = false;
    clearTimeout(noticeTimer);
    if (ms) noticeTimer = setTimeout(hideNotice, ms);
  }
  function hideNotice() { $('notice').hidden = true; }

  /* ---------- Locatie ---------- */
  function coordsLabel(lat, lon) {
    return `${num(Math.abs(lat), 2)}° ${lat >= 0 ? 'N' : 'Z'}, ${num(Math.abs(lon), 2)}° ${lon >= 0 ? 'O' : 'W'}`;
  }
  function setLoc(loc) {
    state.loc = loc;
    writeLoc(loc);
    $('loc-name').textContent = loc.name;
    $('loc-region').textContent = loc.region || '\u00a0';
    document.title = `${loc.name} | WeatherWatcher`;
    refresh();
  }
  function locate() {
    return new Promise((resolve, reject) => {
      if (!('geolocation' in navigator)) return reject(new Error('Geen locatievoorziening'));
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ name: 'Huidige locatie', region: coordsLabel(p.coords.latitude, p.coords.longitude), lat: p.coords.latitude, lon: p.coords.longitude, gps: true }),
        reject,
        { timeout: 10000, maximumAge: 10 * 60 * 1000 }
      );
    });
  }
  async function useGps() {
    setStatus('Locatie bepalen…');
    try {
      setLoc(await locate());
      closeSearch();
    } catch {
      showNotice('Je locatie is niet beschikbaar. Geef de browser toestemming voor locatie of zoek een plaats.', 8000);
      if (!state.data) setLoc(state.loc || DEFAULT_LOC);
    }
  }

  /* ---------- Zoeken ---------- */
  let searchTimer, searchCtrl, results = [];
  function openSearch() {
    $('search').hidden = false;
    $('btn-search').setAttribute('aria-expanded', 'true');
    $('q').focus();
  }
  function closeSearch() {
    $('search').hidden = true;
    $('btn-search').setAttribute('aria-expanded', 'false');
    $('q').value = '';
    $('results').hidden = true;
    $('search-msg').hidden = true;
  }
  function searchMsg(text) {
    $('results').hidden = true;
    $('search-msg').textContent = text;
    $('search-msg').hidden = !text;
  }
  async function search(term) {
    if (searchCtrl) searchCtrl.abort();
    searchCtrl = new AbortController();
    try {
      const res = await fetch(`${GEO}?name=${encodeURIComponent(term)}&count=6&language=nl&format=json`, { signal: searchCtrl.signal });
      const data = await res.json();
      results = data.results || [];
      if (!results.length) return searchMsg('Geen plaats gevonden met die naam.');
      $('search-msg').hidden = true;
      $('results').innerHTML = results.map((r, i) =>
        `<li><button type="button" data-i="${i}">${esc(r.name)}<span>${esc([r.admin1, r.country].filter(Boolean).join(', '))}</span></button></li>`
      ).join('');
      $('results').hidden = false;
    } catch (err) {
      if (err.name !== 'AbortError') searchMsg('Zoeken mislukt. Controleer je internetverbinding.');
    }
  }
  function pick(r) {
    setLoc({ name: r.name, region: [r.admin1, r.country].filter(Boolean).join(', '), lat: r.latitude, lon: r.longitude });
    closeSearch();
  }

  /* ---------- Start ---------- */
  function bind() {
    $('btn-search').addEventListener('click', () => ($('search').hidden ? openSearch() : closeSearch()));
    $('btn-gps').addEventListener('click', useGps);
    $('btn-refresh').addEventListener('click', refresh);
    $('q').addEventListener('input', () => {
      clearTimeout(searchTimer);
      const v = $('q').value.trim();
      if (v.length < 2) { searchMsg(''); return; }
      searchTimer = setTimeout(() => search(v), 300);
    });
    $('q').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && results.length && !$('results').hidden) { e.preventDefault(); pick(results[0]); }
      if (e.key === 'Escape') closeSearch();
    });
    $('results').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-i]');
      if (b) pick(results[Number(b.dataset.i)]);
    });
    setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, REFRESH_MS);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && Date.now() - state.fetchedAt > STALE_MS) refresh();
    });
  }

  async function init() {
    bind();
    const saved = readLoc();
    if (saved && !saved.gps) { setLoc(saved); return; }
    setStatus('Locatie bepalen…');
    try { setLoc(await locate()); }
    catch { setLoc(saved || DEFAULT_LOC); }
  }

  init();
})();
</script>
</body>
</html>
